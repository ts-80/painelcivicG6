        <div class="gear" id="gear">D</div>
        <label id="fuell" for="fuel">FUEL</label>
        <label id="temperatura" for="temp">TEMP</label>
        <div class="rpm"><span id="rpmValue">0</span> rpm</div>

        <div class="speed">
          <span id="speedValue">0</span><small> km/h</small>
        </div>
        <p class="fuel100">100 -</p>
        <p class="fuel75">75 -</p>
        <p class="fuel50">50 -</p>
        <p class="fuel25">25 -</p>
        <p class="fuel0">0 -</p>
        <div class="side-bar" id="fuelBar">
          <div class="level" id="fuelLevel" style="height: 60%"></div>
        </div>

        <div class="side-bar" id="tempBar">
          <div class="level" id="tempLevel" style="height: 40%"></div>
        </div>
        <p class="temp100">100 -</p>
        <p class="temp75">75 -</p>
        <p class="temp50">50 -</p>
        <p class="temp25">25 -</p>
        <p class="temp0">0 -</p>
        <div class="indicators">
          🛢 Óleo &nbsp;&nbsp; ⚠ ABS &nbsp;&nbsp; ↔ Seta
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let speed = 0;
      let rpm = 0;
      let fuel = 100;
      let temp = 40;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const maxArc = Math.PI * 0.6; // ~140 graus

        // ===== RPM (lado esquerdo) =====
        let rpmPercent = rpm / 8000;
        let rpmAngle = rpmPercent * maxArc;

        let rpmStart = Math.PI * 1.1; // deslocado
        let rpmEnd = rpmStart + rpmAngle;

        drawArc(350, 350, 250, rpmStart, rpmEnd, "red", 20);

        // ===== VELOCIDADE (lado direito) =====
        let speedPercent = speed / 240;
        let speedAngle = speedPercent * maxArc;

        let speedStart = Math.PI * 1.1; // fixo
        let speedEnd = speedStart + rpmAngle;

        //   let speedEnd = Math.PI * 1.9;           // fixo
        //   let speedStart = speedEnd - speedAngle;

        drawArc(850, 350, 250, speedStart, speedEnd, "red", 20);
      }

      function drawArc(x, y, radius, start, end, color, width) {
        ctx.beginPath();
        ctx.arc(x, y, radius, start, end);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.shadowBlur = 20;
        ctx.shadowColor = color;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function update() {
        const fuelElement = document.getElementById("fuelLevel");
        document.getElementById("tempLevel");

        speed += (Math.random() - 0.4) * 3;
        rpm += (Math.random() - 0.4) * 250;

        if (speed < 0) speed = 0;
        if (speed > 240) speed = 240;

        if (rpm < 0) rpm = 0;
        if (rpm > 8000) rpm = 8000;

        fuelElement.style.height = fuel + "%";
        fuel -= 0.04;

        document.getElementById("fuelLevel").style.height = fuel + "%";

        if (fuel < 10) {
          fuelElement.style.background = "red";
        } else {
          fuelElement.style.background = "rgb(13, 0, 255)"; // Azul original
        }
        if (fuel < 0) fuel = 100;
        temp += (Math.random() - 0.5) * 0.3;
        if (temp < 30) temp = 30;
        if (temp > 100) temp = 100;

        document.getElementById("speedValue").innerText = Math.round(speed);
        document.getElementById("rpmValue").innerText = Math.round(rpm);

        document.getElementById("tempLevel").style.height = temp + "%";

        draw();
        requestAnimationFrame(update);
      }

      update();
    </script>
