<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Painel Honda Organizado</title>

    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Cinzel", "Roboto", serif;
      }

      .cluster {
        width: 1200px;
        height: 420px;
        border-radius: 40px;
        position: relative;
        box-shadow: 0 0 80px rgba(255, 0, 0, 0.336);
        overflow: hidden;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #fundoazul {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      #car {
        position: relative;
        width: 635px;
        left: 289px;
        top: 41px;
        z-index: 0;
      }

      .logo {
        position: absolute;
        top: 85px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 34px;
        letter-spacing: 3px;
        text-shadow: 0 0 15px red;
      }

      .speed {
        position: absolute;
        right: 270px;
        top: 160px;
        color: white;
        font-family: "Roboto", sans-serif;
        font-weight: bold;
        font-size: 80px;
        text-shadow: 0 0 20px red;
      }

      .speed small {
        font-size: 28px;
      }

      .rpm {
        position: absolute;
        left: 270px;
        top: 170px;
        color: white;
        font-family: "Roboto", sans-serif;
        font-weight: bold;
        font-size: 45px;
        text-shadow: 0 0 15px red;
      }

      .gear {
        position: absolute;
        top: 150px;
        width: 100%;
        text-align: center;
        font-family: "Roboto", sans-serif;
        font-weight: bold;
        font-size: 70px;
        color: white;
        text-shadow: 0 0 20px red;
      }

      .side-bar {
        position: absolute;
        bottom: 80px;
        width: 20px;
        height: 160px;
        background: #222;
        border-radius: 10px;
      }

      #fuelBar {
        left: 40px;
      }
      #tempBar {
        right: 40px;
      }

      .level {
        position: absolute;
        bottom: 0;
        width: 100%;
        border-radius: 10px;
      }

      #fuelLevel {
        background: rgb(13, 0, 255);
      }
      #tempLevel {
        background: orange;
      }

      .indicators {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 18px;
        color: #aaa;
      }
    </style>
  </head>

  <body>
    <div class="cluster">
      <img id="fundoazul" src="fundoazul.png" alt="" />
      <img id="car" src="imagem4 sem fundo.png" alt="" />

      <div class="logo">HONDA</div>

      <canvas id="canvas" width="1200" height="420"></canvas>

      <div class="gear">D</div>
      <div class="rpm"><span id="rpmValue">0</span> rpm</div>
      <div class="speed">
        <span id="speedValue">0</span><small> km/h</small>
      </div>

      <div class="side-bar" id="fuelBar">
        <div class="level" id="fuelLevel" style="height: 60%"></div>
      </div>

      <div class="side-bar" id="tempBar">
        <div class="level" id="tempLevel" style="height: 40%"></div>
      </div>

      <div class="indicators">
        🛢 Óleo &nbsp;&nbsp; ⚠ ABS &nbsp;&nbsp; ↔ Seta
      </div>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let speed = 0;
      let rpm = 0;
      let fuel = 60;
      let temp = 40;

      function drawSegmentedArc(x, y, radius, value, maxValue, totalSegments) {
        const startAngle = Math.PI * 1.15;
        const endAngle = Math.PI * 1.85;
        const arcRange = endAngle - startAngle;

        const activeSegments = Math.floor((value / maxValue) * totalSegments);

        for (let i = 0; i < totalSegments; i++) {
          const segStart = startAngle + (i / totalSegments) * arcRange;
          const segEnd = startAngle + ((i + 0.8) / totalSegments) * arcRange;

          ctx.beginPath();
          ctx.arc(x, y, radius, segStart, segEnd);

          // 🔵 Azul normal
          let color = "#00aaff";

          // 🔴 Últimos 15% viram vermelho (zona de corte)
          if (i > totalSegments * 0.85) {
            color = "#ff0000";
          }

          // Só ilumina até o valor atual
          if (i <= activeSegments) {
            ctx.strokeStyle = color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
          } else {
            ctx.strokeStyle = "#0a1a22";
            ctx.shadowBlur = 0;
          }

          ctx.lineWidth = 12;
          ctx.stroke();
        }

        ctx.shadowBlur = 0;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // RPM (lado esquerdo)
        drawSegmentedArc(
          350,
          350,
          250,
          rpm,
          8000,
          40, // quantidade de blocos
        );

        // Velocidade (lado direito)
        drawSegmentedArc(850, 350, 250, speed, 240, 40);
      }

      function update() {
        speed += (Math.random() - 0.4) * 3;
        rpm += (Math.random() - 0.4) * 250;

        if (speed < 0) speed = 0;
        if (speed > 240) speed = 240;

        if (rpm < 0) rpm = 0;
        if (rpm > 8000) rpm = 8000;

        fuel -= 0.03;
        if (fuel < 0) fuel = 100;

        temp += (Math.random() - 0.5) * 0.3;
        if (temp < 30) temp = 30;
        if (temp > 100) temp = 100;

        document.getElementById("speedValue").innerText = Math.round(speed);
        document.getElementById("rpmValue").innerText = Math.round(rpm);
        document.getElementById("fuelLevel").style.height = fuel + "%";
        document.getElementById("tempLevel").style.height = temp + "%";

        if (fuel < 10) {
          document.getElementById("fuelLevel").style.background = "red";
        } else {
          document.getElementById("fuelLevel").style.background =
            "rgb(13, 0, 255)";
        }

        draw();
        requestAnimationFrame(update);
      }

      update();
    </script>
  </body>
</html>
