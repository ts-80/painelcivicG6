<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Digital Cluster PRO</title>
<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{
  background:#050505;
  border-radius:20px;
}
</style>
</head>
<body>

<canvas id="cluster" width="900" height="400"></canvas>

<script>
const canvas = document.getElementById("cluster");
const ctx = canvas.getContext("2d");

let rpm = 0;
let speed = 0;
let targetRPM = 2500;
let targetSpeed = 105;

let startupPhase = true;
let startupProgress = 0;

function easeOut(t){
  return 1 - Math.pow(1 - t, 3);
}

function drawRainbowArc(x,y,radius,start,end){

  const grad = ctx.createConicGradient(start,x,y);
  grad.addColorStop(0.0,"#00ff00");
  grad.addColorStop(0.25,"#ffff00");
  grad.addColorStop(0.45,"#ff0000");
  grad.addColorStop(0.65,"#00ffff");
  grad.addColorStop(1.0,"#0000ff");

  ctx.lineWidth = 28;
  ctx.lineCap = "round";
  ctx.strokeStyle = grad;

  ctx.beginPath();
  ctx.arc(x,y,radius,start,end);
  ctx.stroke();

  ctx.shadowBlur = 30;
  ctx.shadowColor = "white";
  ctx.stroke();

  ctx.shadowBlur = 0;
}

function drawNeedle(x,y,radius,min,max,value){

  let percent = (value-min)/(max-min);
  let angle = Math.PI*0.75 + percent*(Math.PI*1.5);

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.moveTo(radius-40,0);
  ctx.lineTo(radius-70,-6);
  ctx.lineTo(radius-70,6);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawCenterText(x,y,value,label){

  ctx.fillStyle="white";
  ctx.font="bold 50px Arial";
  ctx.textAlign="center";
  ctx.fillText(Math.round(value),x,y);

  ctx.font="16px Arial";
  ctx.fillText(label,x,y+25);
}

function drawBottomBar(){

  ctx.fillStyle="#111";
  ctx.fillRect(0,350,900,50);

  ctx.fillStyle="white";
  ctx.font="16px Arial";
  ctx.fillText("0:52",50,380);
  ctx.fillText("95 °C",450,380);
  ctx.fillText("32.5",820,380);
}

function render(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  let startAngle = Math.PI*0.75;
  let endAngle = Math.PI*2.25;

  drawRainbowArc(250,200,140,startAngle,endAngle);
  drawRainbowArc(650,200,140,startAngle,endAngle);

  drawNeedle(250,200,140,0,8000,rpm);
  drawNeedle(650,200,140,0,180,speed);

  drawCenterText(250,210,rpm,"RPM");
  drawCenterText(650,210,speed,"KM/H");

  drawBottomBar();

  requestAnimationFrame(render);
}

function update(){

  if(startupPhase){
    startupProgress += 0.02;

    if(startupProgress <= 1){
      let eased = easeOut(startupProgress);
      rpm = 8000 * eased;
      speed = 180 * eased;
    }else if(startupProgress <= 2){
      let eased = easeOut(startupProgress-1);
      rpm = 8000 * (1-eased);
      speed = 180 * (1-eased);
    }else{
      startupPhase = false;
    }

  }else{
    rpm += (targetRPM - rpm) * 0.05;
    speed += (targetSpeed - speed) * 0.05;
  }

  requestAnimationFrame(update);
}

render();
update();
</script>

</body>
</html>
